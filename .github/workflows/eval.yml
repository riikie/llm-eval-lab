name: eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 1) 纯逻辑测试：不读数据、不连库、不需要模型，任何机器都能跑
  # ------------------------------------------------------------------
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas duckdb
      - name: Run unit tests
        run: pytest tests/ -q

  # ------------------------------------------------------------------
  # 2) 完整链路：数据由脚本生成，所以不需要往仓库里塞数据集和权重
  #
  #    这是刻意的：make_seed.py 保证数据可复现，于是 CI 上能把
  #    入湖 → 跑批 → 评分 → golden 校准 → 偏差探针 → 成对比较 → 回归门禁
  #    整条链路真跑一遍，而不是只跑个 pytest 装样子。
  # ------------------------------------------------------------------
  pipeline:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas duckdb

      - name: Generate eval set + ingest
        run: |
          python scripts/make_seed.py
          python scripts/ingest.py --file data/raw/evalset_v2.jsonl --dataset-id cs_v1

      - name: Run 5 versions + score
        run: |
          for v in v1 v2 v3 v4 v5; do
            python scripts/run_batch.py --dataset cs_v1 --app rag:$v
            python scripts/score_run.py  --dataset cs_v1 --app rag:$v
          done

      - name: Pairwise compare
        run: python scripts/compare.py --dataset cs_v1 --a rag:v5 --b rag:v4

      # 评分器不是天然可信的：kappa 低于下限就 fail，别拿它的分数去做门禁
      - name: Golden calibration (scorer vs human labels)
        run: python scripts/calibrate_golden.py --judge

      - name: Judge bias probe
        run: |
          python scripts/calibrate.py || echo "::warning::裁判存在偏差，其分数暂不可用于门禁"

      # 提升场景：v2 → v3 必须放行
      - name: Regression gate (v2 -> v3, must PASS)
        run: python scripts/check_regression.py --dataset cs_v1 --base rag:v2 --cand rag:v3

      # 事故场景：v4 → v5 必须被拦住。
      # continue-on-error 是因为这一步**预期失败**，目的是让"门禁会拦"
      # 在 CI 上真的被执行一遍，而不是只写在文档里。
      - name: Regression gate (v4 -> v5, must BLOCK)
        id: gate_v5
        continue-on-error: true
        run: python scripts/check_regression.py --dataset cs_v1 --base rag:v4 --cand rag:v5

      - name: Assert the gate really blocked v5
        if: steps.gate_v5.outcome == 'success'
        run: |
          echo "::error::门禁放行了 v5 —— refusal_edge 整类从 1.00 归零都没拦住，门禁失效"
          exit 1

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: reports/
